name: Scratch ACL privilege diagnostic
on:
  push:
    branches: ['ci/acl-probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5, peeled commit
      - run: uv python install 3.13
      - name: Compare Git Bash probes with isolated child privileges
        working-directory: tools/x4validate
        run: uv run --frozen python ../../scripts/probe-refguard-gitbash-privileges.py
      - name: Verify every reference-guard behavior and unprotected control
        working-directory: tools/x4validate
        run: uv run --frozen pytest tests/test_x4refguard_behaviour.py -q -rs
