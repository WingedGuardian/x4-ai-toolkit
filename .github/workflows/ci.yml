# Continuous integration for the X4 AI Assistant Toolkit.
#
# WHY THIS EXISTS. Until now every release was verified only on the author's machine,
# against the author's own large mod install. That is the one environment guaranteed NOT
# to resemble a new user's. The concrete failure it allows: a test that reads a file which
# exists only in the author's working tree passes locally and ERRORS on a fresh clone —
# which is the first thing a new user runs, so it reads as "this toolkit is broken".
#
# What CI can and cannot cover, stated plainly rather than implied:
#   CAN  — the unit/regression suite. MEASURED on a clean `git archive` checkout with NO
#          game installed and no env vars set. The pass count is deliberately not
#          written here -- it rots, and CI prints the real one every run.
#   CANNOT — the `gates/` suite. Those are integration checks that need a real X4 install,
#          an unpacked reference tree and a live mod list. They stay a local, pre-release
#          step. A green CI badge therefore means "the code is sound", NOT "the gates pass".

name: CI

on:
  push:
    # `ci/**` is HERE FOR THE PRE-RELEASE OBSERVATION RUN, and without it that
    # run is silent. The release plan (and the note at `experimental` below) says
    # to push the reviewed code to a throwaway `ci/pre-3.1` branch and read the
    # per-JOB conclusions before promoting ubuntu out of experimental. With
    # `[master]` alone that push triggers NOTHING — and "no runs" reads exactly
    # like "nothing broke", which is the worst possible way for a pre-release
    # check to fail. Found by the v3.1.0 release reviewer.
    #
    # `workflow_dispatch` below also works and needs no branch; this makes the
    # WRITTEN plan executable as written, rather than requiring the reader to
    # notice it is not.
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Both legs GATE: ubuntu was promoted on 2026-09-09 (the matrix note below records the run
    # and why). `continue-on-error` stays keyed on `experimental` so demoting a leg is one
    # visible edit. Ubuntu is the only POSIX evidence: Linux/macOS support is still "best
    # effort, not device-tested" (README), so a green ubuntu leg is not a device test.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            # ⚠ TWO CHECKS THIS ARC ADDED RUN ONLY HERE, SO ONLY HERE CAN THEY BE
            # IGNORED. `continue-on-error` above is keyed on this flag, and both
            # `Install for real (--method global, bash)` and `Cold-clone verification`
            # are gated `if: runner.os == 'Linux'`. Each is Linux-only for a sound
            # stated reason (jq on the ubuntu image; `git archive | tar -x`), and
            # nobody re-scoped THIS flag when they were added -- so the bash
            # implementation of `--method global`, the exact method whose PowerShell
            # twin shipped v3.0.0 100% broken because no leg could say so, again has
            # no leg that can say so. Green that could not go red, one level up.
            #
            # NOT FLIPPED HERE ON PURPOSE. CI is observable only on a push, and these
            # checks have never once been enforced, so flipping blind trades a masked
            # failure for a red release. The release plan's sequence is: push the
            # reviewed code to a throwaway `ci/pre-3.1` branch (which the `ci/**`
            # trigger at the top of this file exists to make fire — it did not,
            # until 2026-09-07), read the PER-JOB
            # conclusions (`gh api .../runs/<id>/jobs` -- the run conclusion said
            # success while ubuntu FAILED in 33994180317), and promote to
            # `experimental: false` only once ubuntu is observed green on this code.
            #
            # ** PROMOTED 2026-09-09. The condition above is met: run 34423… had
            # tests (ubuntu-latest) = success, per JOB, 25 steps, 0 non-success. **
            #
            # It took three rounds to get there, and every one of them is the
            # argument for this flag going away:
            #   1. the differential fuzzer exited 2 -- an orphaned control anchor,
            #      which also masked everything after step 11 for a whole release;
            #   2. install.ps1 was 100% dead on POSIX, 21 tests red, caught HERE and
            #      only here, on the leg that cannot fail a build;
            #   3. the skip ceiling failed a leg that had 1,631 passed and 0 failed.
            # All three shipped in v3.1.0 while the run said `success`, because
            # `continue-on-error` turns this leg's verdict into a number nobody reads
            # -- `gh run watch --exit-status` returned 0 with ubuntu red.
            #
            # The two Linux-only checks named above -- `--method global` in bash, and
            # the cold-clone verification -- are consequently ENFORCED for the first
            # time. That is the point: a green that could not go red is not a green.
            experimental: false

    steps:
      # FULL HISTORY, for the tags (lane H). test_shipped_instruction_hashes pins
      # scripts/shipped-instruction-hashes.txt to the CLAUDE.md/AGENTS.md of every v[0-9]*
      # tag, and a depth-1 checkout has no tags -- so that test FAILS here by design
      # (under CI it refuses to skip), rather than going quiet.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      # The vendored BaseX jar had NEVER been executed by CI, on any OS. The 24 BaseX
      # unit tests pass without a JVM because they mock -- test_preflight.py monkeypatches
      # shutil.which and writes a jar that is literally b"not really a jar, but it is a
      # file". So a bad jar, a classpath change or an untracked .basexhome would ship
      # silently: a green that could not have gone red. Java 17 is the MEASURED floor,
      # read out of the jar itself (Build-Jdk-Spec: 17, bytecode major 61).
      - name: Install Java 17 (for the BaseX smoke test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately not a pytest that skips when java is absent: a skip in CI is
      # indistinguishable from a pass. This fails loudly. Scope is 3 documents -- it
      # proves the jar RUNS, not that the corpus is correct.
      - name: BaseX smoke test (real JVM, real query)
        shell: bash
        run: bash tools/basex/smoke-basex.sh

      # Frozen installation consumes the lock without checking freshness. Check
      # separately so stale metadata cannot pass merely because installation worked.
      - name: Check dependency lock freshness
        working-directory: tools/x4validate
        run: uv lock --check

      # The hook regression suite. A PreToolUse hook sits in front of every Bash
      # call, so its two failure modes are both expensive: over-block makes
      # legitimate work impossible, under-block makes the guard decorative while
      # you still trust it. Until 2026-08-29 the shipped hooks had NO test at all.
      # Path-dependent probes SKIP loudly here (no X4 install on a runner) and the
      # tally names the skip count, so a green cannot mean "nothing was exercised".
      - name: Hook regression suite
        shell: bash
        run: bash .claude/hooks/test-protect-bash.sh

      # The three suites that cover this release's central change, and which CI did
      # not run at all until 2026-09-01: 217 unit tests over the single parse pass,
      # 135 E2E probes (the only coverage of protect-files.sh, backup-before-edit.sh,
      # search-scope.sh, the stdin contract and the broken-jq verdict path), and the
      # mutation gate that proves those tests can fail. All three are pure bash/Python
      # and need no X4 install, so the reason `gates/` is excluded does not apply.
      #
      # They GATE on windows-latest and are informational on ubuntu-latest, matching
      # this matrix's existing convention: POSIX behaviour of these hooks has never
      # been measured, and gating on it would assert something unverified.
      - name: Hook parse-pass unit tests
        shell: bash
        run: python .claude/hooks/test_hook_facts.py

      # The AUDIT-2026-09-24 hook tests: settings.json matcher coverage for every
      # file-changing tool, the stdin-from-a-FILE read path, and the PowerShell
      # front-end END TO END (JSON piped into protect-bash.sh). The PowerShell classes
      # need pwsh, which the hosted runners ship; without one they SKIP by name.
      - name: Hook audit tests (matcher coverage, PowerShell front-end E2E)
        shell: bash
        run: python .claude/hooks/test_audit0924_hooks.py

      - name: Hook E2E probe suite
        shell: bash
        run: bash scripts/test-hooks.sh

      - name: Prove the hook tests can fail (mutation + predicate coverage)
        shell: bash
        run: python scripts/verify-hook-tests.py

      - name: Prove the guard has no syntax bypass (differential fuzzer)
        shell: bash
        run: python scripts/fuzz-guard.py

      # THE INSTALLERS, FOR REAL. Nothing in this workflow ran them until 2026-09-02,
      # which is why a silent `exit 1` in `--method global`, an unaccounted unpack, a
      # setup.sh that could not fail, and two installers deleting the user's own config
      # all shipped unnoticed. A smoke run asserts the ARTIFACT, never the exit code
      # alone -- a build is verified by what it produced.
      - name: Install for real (bash) and check the artifacts
        shell: bash
        run: |
          set -euo pipefail
          # ISOLATED (FX-B4, reviewer I): no `if:`, so on the Windows runner install.sh writes
          # X4_TOOLKIT through scripts/x4-userenv.ps1 -- the runner's REAL HKCU\Environment, which
          # persists into later steps. That script honours the installers' test seam instead
          # (refused outside X4ToolkitTests); on Linux nothing reads it.
          export X4_INSTALL_ENV_REGKEY='HKCU\Software\X4ToolkitTests\ci-sh-separate'
          unset X4_TOOLKIT
          TK="$RUNNER_TEMP/tk-sh"
          # A REAL SETUP. Without a virtualenv in the source, the venv assertions
          # below describe a situation that cannot arise, and the collision grep
          # that used to stand here could never match -- a green with no reachable
          # red. uv sync creates one, so there is now something that COULD travel.
          ( cd tools/x4validate && uv sync --frozen >/dev/null 2>&1 ) || true
          test -d tools/x4validate/.venv || { echo "no source venv: the venv assertions below would be vacuous"; exit 1; }
          # A SENTINEL, because "is there a venv in the destination" is the WRONG
          # question: install.sh runs setup.sh there (install.sh:710) and setup.sh runs
          # `uv sync` (setup.sh:76), so a destination venv is what a CORRECT install
          # produces. The old assertion could not pass in any configuration.
          # What must not happen is the SOURCE's venv travelling -- it hardlinks from a
          # shared cache and its pyvenv.cfg and Scripts shims embed absolute paths. A
          # freshly built venv cannot contain this file; a copied one must.
          echo "source-venv sentinel" > tools/x4validate/.venv/.X4_SOURCE_VENV_SENTINEL
          bash install.sh --method separate --toolkit "$TK" --yes
          test -f "$TK/x4-paths.env" || { echo "no x4-paths.env at the toolkit root"; exit 1; }
          test ! -e "$TK/.claude/x4-paths.env" || { echo "a fresh install wrote the 3.x .claude/x4-paths.env"; exit 1; }
          test -d "$TK/tools/x4validate"     || { echo "no tools/x4validate"; exit 1; }
          test -d "$TK/mods"                 || { echo "no mods/ (x4live extension)"; exit 1; }
          # A VENV MUST NOT TRAVEL. The source has one (asserted above), so this
          # is a real question with a reachable wrong answer: it goes red if the
          # copy-time exclusion AND both prunes were removed.
          #
          # It does NOT isolate which of the three did the work, and saying so
          # matters -- what isolates copy-time exclusion is a stubbed cp counting
          # invocations that name a pruned path (0 on both platforms), which CI
          # cannot observe. test_installers_agree.py pins that construct instead.
          test ! -e "$TK/tools/x4validate/.venv/.X4_SOURCE_VENV_SENTINEL" || {
            echo "the SOURCE virtualenv travelled into the destination (sentinel found)"; exit 1; }
          # ...and the destination must HAVE one, or setup.sh silently did not run and
          # the sentinel check above would be vacuous -- a green with no reachable red.
          test -d "$TK/tools/x4validate/.venv" || {
            echo "no destination venv: setup.sh did not run, so the sentinel check proved nothing"; exit 1; }
          # The config bash cannot source is the failure the escaping exists to stop.
          ( set -a; . "$TK/x4-paths.env" ) || { echo "x4-paths.env does not source"; exit 1; }

          # DIRECTION: a second install over the same toolkit must REFUSE without the
          # flag. This is the defect that overwrote a developer's game folder.
          if bash install.sh --method separate --toolkit "$TK" --yes; then
            echo "installing over an existing install was ALLOWED without --over-existing"; exit 1
          fi

          # ...and with the flag it proceeds AND keeps the user's own settings in the
          # LIVE file. `grep -r` over .claude/ is NOT the test: the .bak satisfies it
          # whether or not the live config kept anything.
          printf '\nX4_NEXUS_KEY="CI_MARKER"\n' >> "$TK/x4-paths.env"
          # The upgrade path, with a virtualenv on BOTH sides -- the exact
          # arrangement that used to break it. uv hardlinks package files from a
          # shared cache, so once both trees are synced the same file has the same
          # inode in each and a recursive copy refuses, hundreds of times, part
          # way through, and `set -e` kills the script before the config restore.
          #
          # The collision grep below is BELT-AND-BRACES, not an independent check:
          # the destination is pruned BEFORE the copy now, so the collision is no
          # longer reachable and the grep cannot go red on its own. It stays
          # because it costs nothing and names the historical failure exactly.
          ( cd "$TK/tools/x4validate" && uv sync --frozen >/dev/null 2>&1 ) || true
          set +e
          bash install.sh --method separate --toolkit "$TK" --over-existing --yes \
            > "$RUNNER_TEMP/upgrade.log" 2>&1
          up_rc=$?
          set -e
          cat "$RUNNER_TEMP/upgrade.log"
          test "$up_rc" = "0" || { echo "the --over-existing upgrade failed"; exit 1; }
          if grep -q "are the same file" "$RUNNER_TEMP/upgrade.log"; then
            echo "the upgrade copy hit a hardlink collision -- a venv travelled"; exit 1
          fi
          grep -q CI_MARKER "$TK/x4-paths.env" || {
            echo "a re-install reverted the LIVE user config"; exit 1; }
          echo "installer smoke OK"

      # TWO legs, and the difference between them is the point. The pwsh 7 leg is
      # what ran before, and it could not see the defect that shipped: Windows
      # PowerShell 5.1 splits a native argument containing double quotes at the
      # first space, and 7.x does not. The destination here CONTAINS A SPACE,
      # which is what a stock Steam install looks like and what the README's own
      # command produces.
      - name: Install for real (Windows PowerShell 5.1, spaced path)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # ISOLATED from the earlier steps (FX-B2, CI on da93d2d): a runner keeps HKCU across
          # steps, so the bash leg's X4_TOOLKIT write reached this one as a "different
          # existing value". Each leg gets its own test key (the installers' seam) and no
          # inherited X4_TOOLKIT.
          $env:X4_INSTALL_ENV_REGKEY = 'HKCU\Software\X4ToolkitTests\ci-ps51'
          Remove-Item -LiteralPath env:X4_TOOLKIT -ErrorAction SilentlyContinue
          $tk = Join-Path $env:RUNNER_TEMP 'tk ps51'
          & .\install.ps1 -Method separate -Toolkit $tk -Yes
          if ($LASTEXITCODE -ne 0) { Write-Error "the 5.1 install failed (exit $LASTEXITCODE)" }
          foreach ($p in @('x4-paths.env','tools\x4validate','mods')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tk $p))) { Write-Error "missing: $p" }
          }
          if (Test-Path -LiteralPath (Join-Path $tk '.claude\x4-paths.env')) { Write-Error 'a fresh install wrote the 3.x .claude\x4-paths.env' }
          # A FILE COUNT, because the failure produced a half-install of ~243
          # files that still carried x4-paths.env and tools/x4validate -- so
          # every existence check above passed straight through it.
          $n = (Get-ChildItem -Recurse -File -LiteralPath $tk).Count
          if ($n -lt 1000) { Write-Error "only $n files: this is a half-install, not an install" }
          Write-Host "5.1 installer smoke OK ($n files, destination contains a space)"

      - name: Install for real (PowerShell) and check the artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:X4_INSTALL_ENV_REGKEY = 'HKCU\Software\X4ToolkitTests\ci-ps7'   # isolated: see the 5.1 leg
          Remove-Item -LiteralPath env:X4_TOOLKIT -ErrorAction SilentlyContinue
          $tk = Join-Path $env:RUNNER_TEMP 'tk-ps'
          & .\install.ps1 -Method separate -Toolkit $tk -Yes
          if ($LASTEXITCODE -ne 0) { Write-Error "the pwsh install failed (exit $LASTEXITCODE)" }
          foreach ($p in @('x4-paths.env','tools\x4validate','mods')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tk $p))) { Write-Error "missing: $p" }
          }
          if (Test-Path -LiteralPath (Join-Path $tk '.claude\x4-paths.env')) { Write-Error 'a fresh install wrote the 3.x .claude\x4-paths.env' }

          # DIRECTION, mirrored from the bash leg. Two legs claiming to test the same
          # contract while testing different things is how a released claim goes false
          # with nothing turning red -- which is exactly what happened to the config
          # backup: fixed in bash, absent in PowerShell, and the CHANGELOG said "both".
          & .\install.ps1 -Method separate -Toolkit $tk -Yes
          if ($LASTEXITCODE -eq 0) { Write-Error 'installing over an existing install was ALLOWED without -OverExisting' }

          Add-Content -LiteralPath (Join-Path $tk 'x4-paths.env') -Value 'X4_NEXUS_KEY="CI_MARKER"'
          & .\install.ps1 -Method separate -Toolkit $tk -OverExisting -Yes
          if ($LASTEXITCODE -ne 0) { Write-Error 'the -OverExisting upgrade failed' }
          if (-not ((Get-Content -Raw -LiteralPath (Join-Path $tk 'x4-paths.env')) -match 'CI_MARKER')) {
            Write-Error 'a re-install reverted the LIVE user config'
          }
          Write-Host 'installer smoke OK'

      # THE OTHER TWO METHODS. Every installer step above this line runs `separate`,
      # and only `separate` -- 8 invocations, one method. So `global` and `in-game`
      # had no reachable failing branch at all, which is how `-Method global` shipped
      # in v3.0.0 100% broken: it threw on EVERY run, on 5.1 and 7 alike, and no leg
      # could have said so. A green that could not have gone red is decoration.
      #
      # Each leg asserts the ARTIFACT and then the DIRECTION, mirroring the separate
      # legs: install, prove what landed, prove a re-install REFUSES without the
      # opt-in flag, prove the flag lets it through.
      #
      # CLAUDE_CONFIG_DIR redirects the global destination away from the runner's own
      # ~/.claude. It is the ONLY thing that does: the method falls back to
      # $HOME/.claude (install.sh) and %USERPROFILE%/.claude (install.ps1), so
      # redirecting one without the other leaves the fallback live.

      - name: Install for real (--method global, bash) and check the gate
        # Linux only, deliberately: this arm requires jq, which is guaranteed on the
        # ubuntu image. Asserting its presence on the Windows image would gate the
        # release on an assumption about someone else's runner. install.ps1's global
        # arm needs no jq and is covered on Windows below, so both implementations of
        # the arm are exercised -- just not both on both.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "jq is missing on the ubuntu image, so this leg's premise is gone"; exit 1; }
          TK="$RUNNER_TEMP/tk-sh"                       # installed by the separate leg above
          test -d "$TK/.claude/skills" || { echo "the separate leg did not run; nothing to install FROM"; exit 1; }
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/globalhome"
          rm -rf "$CLAUDE_CONFIG_DIR"; mkdir -p "$CLAUDE_CONFIG_DIR"
          bash install.sh --method global --toolkit "$TK" --yes
          # ARTIFACTS, not the exit code. A method that copied nothing must not read as
          # installed -- both installers grew that exact refusal after doing exactly that.
          n=$(find "$CLAUDE_CONFIG_DIR/skills" -maxdepth 1 -name 'x4-*' -type d | wc -l)
          test "$n" -ge 5 || { echo "only $n x4-* skills installed"; exit 1; }
          test -f "$CLAUDE_CONFIG_DIR/settings.json" || { echo "no settings.json"; exit 1; }
          jq -e '.env.X4_TOOLKIT' "$CLAUDE_CONFIG_DIR/settings.json" >/dev/null || {
            echo "settings.json has no X4_TOOLKIT: the env merge did not happen"; exit 1; }
          # A pre-existing file must survive a REFUSED run untouched.
          echo 'must survive' > "$CLAUDE_CONFIG_DIR/skills/x4-mine.md"

          # DIRECTION: a second global install over pre-existing x4-* skills must
          # REFUSE. This method force-overwrote them with no prompt and no backup, and
          # keeps no backup of skills even now -- so the refusal IS the protection.
          if bash install.sh --method global --toolkit "$TK" --yes; then
            echo "a global install over existing x4-* skills was ALLOWED without --over-existing"; exit 1
          fi
          grep -q 'must survive' "$CLAUDE_CONFIG_DIR/skills/x4-mine.md" || {
            echo "the refused run still modified a pre-existing file"; exit 1; }

          bash install.sh --method global --toolkit "$TK" --over-existing --yes
          echo "global installer smoke OK ($n x4-* skills)"

      - name: Install for real (-Method global, PowerShell) and check the gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # FX-B3 (reviewer F M4): isolated like the two separate legs -- its own test key and no
          # inherited X4_TOOLKIT (HKCU persists across steps; see the 5.1 leg).
          $env:X4_INSTALL_ENV_REGKEY = 'HKCU\Software\X4ToolkitTests\ci-ps-global'
          Remove-Item -LiteralPath env:X4_TOOLKIT -ErrorAction SilentlyContinue
          $tk = Join-Path $env:RUNNER_TEMP 'tk-ps'      # installed by the separate leg above
          if (-not (Test-Path -LiteralPath (Join-Path $tk '.claude/skills'))) {
            Write-Error 'the separate leg did not run; nothing to install FROM' }
          # BOTH the primary and the fallback. install.ps1 reads CLAUDE_CONFIG_DIR and
          # then %USERPROFILE%/.claude, so setting one leaves the other live.
          $hc = Join-Path $env:RUNNER_TEMP 'globalhome-ps'
          if (Test-Path -LiteralPath $hc) { Remove-Item -Recurse -Force -LiteralPath $hc }
          New-Item -ItemType Directory -Force -Path $hc | Out-Null
          $env:CLAUDE_CONFIG_DIR = $hc

          & .\install.ps1 -Method global -Toolkit $tk -Yes
          if ($LASTEXITCODE -ne 0) { Write-Error "the global install failed (exit $LASTEXITCODE)" }
          $n = @(Get-ChildItem -Directory -LiteralPath (Join-Path $hc 'skills') -Filter 'x4-*').Count
          if ($n -lt 5) { Write-Error "only $n x4-* skills installed" }
          $sj = Join-Path $hc 'settings.json'
          if (-not (Test-Path -LiteralPath $sj)) { Write-Error 'no settings.json' }
          if (-not ((Get-Content -Raw -LiteralPath $sj | ConvertFrom-Json).env.X4_TOOLKIT)) {
            Write-Error 'settings.json has no X4_TOOLKIT: the env merge did not happen' }

          # DIRECTION. Until this release the global arm reached NO gate: -OverExisting
          # was consulted only on the copy-to-destination path, which this method never
          # takes, so it silently replaced a user's own edited x4-* skills.
          $mine = Join-Path $hc 'skills/x4-mine.md'
          Set-Content -LiteralPath $mine -Value 'must survive'
          & .\install.ps1 -Method global -Toolkit $tk -Yes
          if ($LASTEXITCODE -eq 0) {
            Write-Error 'a global install over existing x4-* skills was ALLOWED without -OverExisting' }
          if ((Get-Content -Raw -LiteralPath $mine) -notmatch 'must survive') {
            Write-Error 'the refused run still modified a pre-existing file' }
          & .\install.ps1 -Method global -Toolkit $tk -OverExisting -Yes
          if ($LASTEXITCODE -ne 0) { Write-Error 'the -OverExisting global upgrade failed' }
          Write-Host "global installer smoke OK ($n x4-* skills)"

      - name: Install for real (--method in-game, bash) and check the gate
        shell: bash
        run: |
          set -euo pipefail
          # A FAKE game folder, named EXPLICITLY. --game must be named: an auto-detected
          # destination with --yes is refused outright, which is the rule that exists
          # because an auto-detected install once wrote 1,642 files into a real Steam
          # install and exited 0.
          # ISOLATED like the separate bash leg (FX-B4): no `if:`, so it runs on Windows too.
          export X4_INSTALL_ENV_REGKEY='HKCU\Software\X4ToolkitTests\ci-sh-ingame'
          unset X4_TOOLKIT
          GAME="$RUNNER_TEMP/fakegame-sh"
          rm -rf "$GAME"; mkdir -p "$GAME/extensions"
          for n in 01 02 03 04 05 06 07 08 09; do : > "$GAME/$n.cat"; done
          bash install.sh --method in-game --game "$GAME" --yes
          test -f "$GAME/x4-paths.env" || { echo "no x4-paths.env in the game folder"; exit 1; }
          test ! -e "$GAME/.claude/x4-paths.env" || { echo "a fresh install wrote the 3.x .claude/x4-paths.env"; exit 1; }
          test -d "$GAME/tools/x4validate"     || { echo "no tools/x4validate"; exit 1; }
          test -d "$GAME/.claude/hooks"        || { echo "no .claude/hooks: in-game is the layout that HAS the guards"; exit 1; }
          # The .cat files must still be there. For every user of this method the
          # destination IS a real game install, and installing may not disturb it.
          test -f "$GAME/01.cat" || { echo "the installer disturbed the game's own files"; exit 1; }
          if bash install.sh --method in-game --game "$GAME" --yes; then
            echo "an in-game install over an existing one was ALLOWED without --over-existing"; exit 1
          fi
          bash install.sh --method in-game --game "$GAME" --over-existing --yes
          echo "in-game installer smoke OK"

      - name: Install for real (-Method in-game, PowerShell) and check the gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # FX-B3 (reviewer F M4): isolated like the two separate legs (see the 5.1 leg).
          $env:X4_INSTALL_ENV_REGKEY = 'HKCU\Software\X4ToolkitTests\ci-ps-ingame'
          Remove-Item -LiteralPath env:X4_TOOLKIT -ErrorAction SilentlyContinue
          $game = Join-Path $env:RUNNER_TEMP 'fakegame-ps'
          if (Test-Path -LiteralPath $game) { Remove-Item -Recurse -Force -LiteralPath $game }
          New-Item -ItemType Directory -Force -Path (Join-Path $game 'extensions') | Out-Null
          foreach ($n in '01','02','03','04','05','06','07','08','09') {
            Set-Content -LiteralPath (Join-Path $game ($n + '.cat')) -Value '' }
          & .\install.ps1 -Method in-game -Game $game -Yes
          if ($LASTEXITCODE -ne 0) { Write-Error "the in-game install failed (exit $LASTEXITCODE)" }
          foreach ($p in @('x4-paths.env','.claude/hooks','tools/x4validate','mods')) {
            if (-not (Test-Path -LiteralPath (Join-Path $game $p))) { Write-Error "missing: $p" }
          }
          if (Test-Path -LiteralPath (Join-Path $game '.claude/x4-paths.env')) { Write-Error 'a fresh install wrote the 3.x .claude/x4-paths.env' }
          if (-not (Test-Path -LiteralPath (Join-Path $game '01.cat'))) {
            Write-Error "the installer disturbed the game's own files" }
          & .\install.ps1 -Method in-game -Game $game -Yes
          if ($LASTEXITCODE -eq 0) {
            Write-Error 'an in-game install over an existing one was ALLOWED without -OverExisting' }
          & .\install.ps1 -Method in-game -Game $game -OverExisting -Yes
          if ($LASTEXITCODE -ne 0) { Write-Error 'the -OverExisting in-game upgrade failed' }
          Write-Host 'in-game installer smoke OK'

      # -rs NAMES every skip, and the budget makes a silent-skip regression LOUD.
      # MEASURED 2026-09-01: 125 tests skipped because they looked for a `dev/`
      # directory that does not exist in this repo -- the game extension ships at
      # `mods/` -- and the total collapsed them into one number nobody reads. They
      # guarded a Lua contract whose violation hangs X4 and needs a force-kill.
      # The stamper was extended this round to cover BOTH lua files and was then
      # invoked by nothing -- not here, and not by scripts/run-gates.sh, which
      # discovers gates/*.py only. A fix that runs nowhere is not a fix: the
      # defect it addressed (an engine_probe.lua change shipping undetected) could
      # recur unchanged. --check recomputes and compares; it writes nothing.
      - name: The shipped lua BUILD stamps are current
        working-directory: tools/x4validate
        run: uv run --frozen python scripts/stamp-mod-build.py --check

      # Codex's OWN policy checker proves .codex/rules/x4.rules parses and that every rule's
      # match/not_match examples hold (tests/test_codex_rules.py). Pinned: the measurements
      # behind the Codex adapter are for 0.160.0, and a new Codex must not move them unseen.
      # Without it those tests SKIP (counted), which would be a dormant check on CI.
      - name: Install the Codex CLI (pinned) for the .rules checks
        run: npm i -g @openai/codex@0.160.0

      - name: Run the suite with NO game installed
        working-directory: tools/x4validate
        # X4_MAX_SKIPS turns the skip COUNT into a failure instead of a number nobody
        # reads. Deliberately generous: a runner with no X4 and fewer optional deps
        # legitimately skips more than a configured machine, and a ceiling that cries
        # wolf is one people learn to ignore. It is set to catch the failure that
        # actually happened -- 125 tests going silently dormant at once -- not to police
        # normal environmental variation.
        env:
          # PER-OS, because the single number was calibrated on ONE platform and had
          # never run on the other. The 43 recorded below was MEASURED on a Windows
          # clone with every X4_* variable cleared; the first CI run that actually
          # executed this leg (33777842225, 2026-09-03, over 74 unpushed commits)
          # measured ubuntu at 53 and windows at 42. So the ceiling was simultaneously
          # too low where it ran and untested where it mattered -- a bound that could
          # not go red on Linux and could not stay green there either.
          #
          # POSIX legitimately skips more, and all 53 were read rather than assumed:
          # 16 need a configured X4 install (corpus_sweep, qa_sweep), 12 are dev-only
          # docs/scripts, 10 need a real reference tree, 5 need a case-insensitive
          # filesystem, 4 are platform-specific, 6 are registry/fixture/path-shape.
          # None is a test silently dormant, which is the only thing this ceiling is
          # for -- 125 went dormant at once, once, and that is the shape it must catch.
          #
          # Headroom stays small on purpose. A ceiling far above the real floor cannot
          # detect a dormant block, so windows keeps its measured floor + 3 and ubuntu
          # + 2.
          #
          # RAISED 2026-09-05, 45 -> 49 / 55 -> 59, because the arc's own tests pushed
          # the floor past the ceiling and this leg would have gone RED on push.
          #
          # The floor was re-measured against a REAL CLONE with every X4_* cleared and
          # the roots ASSERTED to resolve to None -- not `git archive`, which leaves no
          # .git and adds ~6 "not a git checkout" skips CI never sees. That instrument
          # was then validated rather than trusted: run against the exact commit CI run
          # 33777842225 measured, it returned 42 skips -- CI-windows' own figure, to the
          # test. So the machine difference is ZERO and the whole delta is ours.
          #
          # Windows floor is now 46, and all four added skips are accounted for, each
          # +1, buckets summing to the total:
          #   qa_sweep import 8 -> 9 (test_UNSWEPT... loads it via import_gate)
          #   test_changed_cli      snapshots_dir() refused with no registry
          #   test_effective_scope  docs/BLIND-SPOTS.md is not in this repo at all
          #   test_every_gate_can_fail  gates/oracle.py refuses without a configured X4
          # None is a test gone dormant, which is the only thing this ceiling is for.
          #
          # Ubuntu's 57 is INFERRED, not measured -- there is no Linux box here. The
          # inference is narrow: all four causes are platform-neutral (a missing install,
          # a missing registry, a file absent from the repo), none touches case
          # sensitivity, path shape or a platform-specific tool, and the Windows
          # reproduction was exact. If CI reports otherwise, take CI's number.
          #
          # RAISED 2026-09-06 (49 -> 56 windows, 59 -> 67 ubuntu) BEFORE the v3.1.0
          # push, because the old ceiling would have failed CI on a CEILING rather than
          # on a defect -- and on the windows leg, which is the one that gates.
          #
          # MEASURED cold at 53 on Windows by `scripts/verify-cold.sh`, which is the
          # ONLY instrument here that can be believed: it REFUSES to run until it has
          # proved registry/game_extensions/reference all resolve to None. Two cheaper
          # "cold" setups were tried first and BOTH were fully configured --
          # `env -u X4_*` gave 14 skips (falls through $X4_TOOLKIT to x4-paths.env,
