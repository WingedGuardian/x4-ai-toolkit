          # the public repo at all), then 24 across fifteen files. Only THREE skipping
          # files were touched by this arc (every_gate_can_fail 2, lockstep_gate 2,
          # line_ending_pin 1), so most of the rise predates it. None is a test gone
          # dormant, which is the only thing this ceiling is for.
          #
          # Headroom is +3 over the measurement, the same margin the 46 -> 49 pair
          # used. Ubuntu stays INFERRED: the one run that measured both had ubuntu 11
          # above windows (53 vs 42, run 33777842225), so measurement + 11 + 3.
          #
          # ** RE-MEASURED 2026-09-07, twice more after the review rounds: windows
          # cold is 57, not 53 and not the 56 this comment said an hour ago. **
          # Real headroom against the 59 below is therefore +2, not +3. Still safe,
          # and CI's own floor is LOWER than this figure: `verify-cold.sh` runs from
          # a `git archive` extract with no `.git` and no tags, so the git-dependent
          # tests skip there and will NOT skip on a real checkout (measured near 54). The whole +3 is `tests/test_build_release.py`, attributed
          # per file by diffing the two verify-cold runs rather than by reading the
          # totals: 3 of its 4 tests need a git checkout carrying the v3.0.0 tag, and
          # a `git archive` extract is neither a repo nor tagged, so they skip for the
          # same "not this repo" reason as blind_spots_ids and next_blind_spot_id.
          # Nothing else moved -- every other file is byte-identical in both runs.
          #
          # ⚠ THE OLD 56 WAS EXACTLY AT THE MEASUREMENT, so the gating Windows leg had
          # ZERO headroom and one further skip would have failed the release on a
          # CEILING rather than on a defect -- which is the failure this pair already
          # had once, and the reason the margin is stated rather than assumed. New
          # pair: windows 56 + 3 = 59, ubuntu 56 + 11 + 3 = 70.
          # ** Re-read the per-JOB conclusion after the first push and take CI's
          # numbers over these. ** `gh api .../runs/<id>/jobs` -- never the run
          # conclusion, which reported success while ubuntu FAILED in run 33994180317.
          #
          # ** RE-MEASURED 2026-09-09 from run 34421093364, and it happened AGAIN. **
          # OBSERVED: windows 59, ubuntu 71. So ubuntu failed this step on the CEILING
          # with 1,631 passed and ZERO failed, and windows sat at exactly 59 of 59 --
          # the identical zero-headroom state this comment describes two paragraphs up
          # and calls "the reason the margin is stated rather than assumed". Twice now,
          # the same way: the numbers were INFERRED (56 + 11) instead of read off a run.
          #
          # Both breaches shipped in v3.1.0 unseen, because this step never executed --
          # the fuzzer failed at step 11 and everything after it was skipped.
          #
          # Every one of ubuntu's 71 was CLASSIFIED before raising anything, buckets
          # summing to 71 of 71, so this is not a ceiling raised to silence a signal:
          #    38  no X4 install and no reference tree on the runner
          #    12  Windows-only behaviour, correctly skipped on Linux
          #    18  a dev-only file absent from the public mirror
          #     3  no registry configured, so the guard has nothing to guard
          # None is a test going dormant, which is the 125-at-once failure this ceiling
          # exists to catch. The skips are what a bare runner legitimately produces.
          #
          # MEASURED + 3, the established margin, and MEASURED means read off a run:
          #    windows  59 + 3 = 62
          #    ubuntu   71 + 3 = 74
          # Ubuntu is no longer inferred from windows. If either leg moves again, read
          # the per-JOB number and classify the skips before touching these.
          #
          # ** LOWERED 2026-09-15, 74 -> 68 ubuntu and 62 -> 56 windows. ** The floor
          # had FALLEN, so the old pair had grown 9 of slack on each leg -- room for
          # tests to go dormant unseen, which is the one thing this ceiling is for.
          # Read off run 34929189538 (ccd454f), per job: ubuntu 65, windows 53, and
          # attributed PER FILE against run 34421093364, identically on both legs:
          #    -13  test_blind_spots_ids 7, test_next_blind_spot_id 5,
          #         test_effective_scope 1 -- docs/BLIND-SPOTS.md ships in this repo now
          #     +8  conftest 3 (qa_sweep import), claude_md_budget 1, deploy_parity 1,
          #         ffinames 1, recon_buckets_are_vanilla_attested 1 -- each a check
          #         that needs a configured X4, reference tree or game root
          # All 65 classified, buckets summing to 65 of 65:
          #    49  no X4 install, reference tree, game root or registry on the runner
          #    12  Windows-only behaviour or a case-insensitive filesystem (ubuntu only)
          #     4  tag v3.0.0 absent from the depth-1 checkout (see the scrub job)
          # Windows is the same 49 + 4 = 53. None is a test gone dormant.
          #    windows  53 + 3 = 56
          #    ubuntu   65 + 3 = 68
          #
          # ** RAISED 2026-10-02 (lane D, Layer 2 on reference/), 68 -> 122 ubuntu and
          # 56 -> 59 windows. ** One new bucket per leg, counted by COLLECTION of the three
          # new files (each test id's skipif reason), not yet read off a CI run -- re-read
          # the per-job -rs output on the first run and correct these if they differ:
          #    54  NTFS deny (x4refguard): Windows-only mechanism -- ubuntu only
          #        (test_x4refguard 13, test_x4refguard_behaviour 38, test_unpack_reference_layer2 3)
          #     3  real chmod semantics of the POSIX branch -- windows only (test_x4refguard)
          #    windows  56 + 3 = 59
          #    ubuntu   68 + 54 = 122
          #
          # ** RAISED 2026-10-02 (lane H, installers), 122 -> 132 ubuntu, windows 59
          # unchanged. ** INFERRED from the tests' skipif reasons, NOT read off a run --
          # re-read the per-job -rs output on the first run and correct these:
          #    +14 ubuntu  the user environment lives in the registry on Windows only
          #                (test_install_over_existing: 5 registry tests x 2 installers,
          #                the x4-userenv round trip 1, its seam refusal 3)
          #     +4 windows POSIX shell profile (2 parametrised + 2)
          #     -4 both    the tag v3.0.0 bucket above: this job now checks out with
          #                fetch-depth: 0, so test_build_release finds its tag
          #    windows  59 - 4 + 4 = 59
          #    ubuntu   122 - 4 + 14 = 132
          #
          # ** RE-SET 2026-10-04 (Plan 3 CI-fix lane): 132 -> 144 ubuntu, 59 -> 56 windows. **
          # MEASURED base = run 37172347642 (ci/plan2 @ 1147709), the per-job -rs lists summed
          # by their [N] counts: ubuntu 139, windows 53 (the ubuntu leg FAILED on 139 > 132).
          # The lane-H estimate above was 7 short on ubuntu. Deltas from this lane, DERIVED from
          # skipif reasons, NOT yet read off a run -- confirm both on the next run:
          #     +2 ubuntu  NTFS ACLs: the Windows mechanism (test_x4refguard: a real
          #                foreign-owner refusal twin + the real /setowner form)
          #      0 windows the x4refguard / Layer 2 tests that errored on the elevated runner
          #                now take ownership of their own scratch tree; if that ever fails
          #                they SKIP (counted) and this ceiling goes red, as it should
          #    windows  53 + 0 + 3 = 56
          #    ubuntu   139 + 2 + 3 = 144
          #
          # ** ITEMISED 2026-10-04 (v4.0.0 review R7-11: "the +3 is unexplained"). ** In every
          # pair above the trailing +3 is HEADROOM, not a skip: the margin set 2026-09-07 so that
          # one new legitimate skip fails on review of this comment, not on a release push. It
          # stands for no test. The ONLY skip-count deltas are the itemised lines. FX-I adds:
          #     +1 ubuntu  test_effective_unreadable::test_a_store_REACHED_THROUGH_a_UNC_path_opens
          #                ("UNC paths are a Windows spelling"); on windows it RUNS where the local
          #                admin share is reachable, else it skips -- a GitHub runner is expected
          #                to reach \\localhost\D$, UNVERIFIED until the next run
          #    windows  53 + 0 + 0 + 3 = 56
          #    ubuntu   139 + 2 + 1 + 3 = 145
          # Re-measure both legs per JOB on the next run and replace these with what CI read.
          # RE-MEASURED 2026-10-08, run 37746049392 at fbf5641: ubuntu had
          # 4,773 passed, 203 skipped, zero failed tests; 203 exceeded 145.
          # Compared every grouped skip with run 37172347642 (139 skips).
          # All +64 are native Windows exclusions: bash resolver +7,
          # config spellings +15, UNC +1, installers +24 (PS5.1 +6,
          # display/MSYS +2, rendering +4, registry seam +6, registry +6),
          # toolkit binding +1, unpack path spellings +4, doctor +9
          # (streams +3, WSL stubs +6), NTFS guard +3. Other changes only
          # clarify existing skip reasons. Preserve the established +3 margin.
          # READ 2026-10-10 (reviewer M-5) off run 37846813450 at a38e3cf, per job:
          # windows 54 skipped, ubuntu 204 (the cold clone also 204). So windows sits at
          # 54 + 2 = 56, ubuntu at 204 + 2 = 206: each leg has 2 of headroom, not 3.
          # Maintainer's decision 2026-10-10: leave both until the next CI run, then set
          # each to that run's per-job measured count + 3 and itemise the change here.
          # DONE 2026-10-12 off run 38287706366 at 040069a, per job, item by item vs
          # 37846813450: windows 54 -> 57 = +2 test_case_alias_vpaths (issue #6's Linux
          # case-fold tests; a case-insensitive filesystem cannot hold two spellings) and
          # +1 test_adapting_doc checkout twin; ubuntu 204 -> 205 = that same twin. The
          # twin was a REGRESSION, not a skip: since FX-H2 an `agent/` dir alone reads as
          # an install, so it skipped instead of testing; fixed (real git checkout), -1
          # each. FX-H10 adds +1 on ubuntu (git there ignores dubious ownership, so that
          # control cannot bite). Expected next run: windows 56, ubuntu 205; ceilings +3.
          X4_MAX_SKIPS: ${{ matrix.os == 'ubuntu-latest' && '208' || '59' }}
          # No .pyc from CI: a stale cache cannot then masquerade as the source.
          PYTHONDONTWRITEBYTECODE: '1'
        run: uv run --frozen python -m pytest -q -rs

      # THE COLD CHECK, WIRED. `scripts/verify-cold.sh` is named in five documents
      # (CLAUDE.md, REVIEW-SCOPE.md, SUBAGENT-BRIEF.md, TRUST.md, CHANGELOG.md) and
      # in five test files -- and until now it was RUN by nothing. One test reads
      # its SOURCE to check the CLI matrix; none executes it. Every other mention is
      # prose. `smoke-basex.sh` exists for the same reason and has been wired since
      # it was written.
      #
      # It is the check that has lied most: verifying "like a fresh clone" by hand
      # produced a confident green THREE TIMES IN A ROW on one release, because path
      # resolution falls through to $X4_TOOLKIT and a configured machine masquerades
      # as a clean one. What that hid was fatal for every new user -- gates resolve
      # paths at IMPORT time and a SystemExit during pytest COLLECTION aborts the
      # whole session. The script refuses to run until it has PROVEN
      # registry/game_extensions/reference are all None, which is the load-bearing
      # part and the reason it cannot be replaced by `env -u`.
      #
      # Linux only: it clones committed objects with Git metadata into an isolated
      # checkout and runs there. No private config travels; the cold precondition
      # still refuses any resolved X4 path. The Windows leg covers the same suite.
      # If it should gate
      # on Windows too, that is a deliberate widening, not an oversight.
      - name: Cold-clone verification (the check that has lied most)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/x4validate/scripts/verify-cold.sh

      # THE RELEASE ZIP'S POPULATION (FX-H2 / I-1): `git archive`, no .git -- what a user
      # extracts and installs in place. F262 swapped this leg for the clone above when three
      # tests needed Git metadata, which hid the failing population instead of fixing it.
      # The extract sits inside this checkout, so the script sets GIT_CEILING_DIRECTORIES and
      # REFUSES unless git can no longer see any repository (else this passes vacuously).
      - name: Cold-archive verification (the release zip, no Git metadata)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/x4validate/scripts/verify-cold.sh --archive

  scrub:
    name: no personal data in tracked files
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is LOad-BEARING, not tidiness. The identifier scan below
      # derives what to look for from this repo's own commit metadata, and the
      # default depth-1 checkout exposes ONE commit. MEASURED on a real depth-1
      # clone: 0 identifiers to check, "clean", exit 0 — a green light produced
      # by looking for nothing, while three real hits sat in the tree. The scan
      # now refuses (exit 2) rather than pass vacuously, and this is what keeps
      # it from ever having to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans TRACKED FILES ONLY, via `git ls-files`. This is not a detail: a raw
      # recursive grep also walks `.venv/`, whose activate scripts and dist-info embed the
      # absolute path of whoever last built it — MEASURED, that alone produced 8 hits, all
      # false. Scanning the wrong population is how a scrub check becomes noise and then
      # gets ignored.
      #
      # The patterns are deliberately GENERIC — no real username, profile id or key is
      # written here, because the guard must not itself leak what it is guarding against.
      - name: Scan for absolute user paths, profile ids and secrets
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t FILES < <(git ls-files)
          echo "scanning ${#FILES[@]} tracked file(s)"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::git ls-files returned nothing — the scan population is empty, so a clean result would prove nothing."
            exit 1
          fi

          fail=0

          # NOTE (2026-09-01): the absolute-user-path and X4-profile-id checks that used
          # to live here as greps have MOVED into scripts/scan-identifiers.py, which
          # runs as its own step below.
          #
          # They were two implementations of one predicate, and they disagreed: the
          # greps knew nothing about placeholders, so the GENERIC fixtures that replaced
          # a real leak made this job red -- 7 hits across 2 files, every one a
          # stand-in. The copy that lives in the workflow is also the copy nobody can
          # test; the scanner's `--selftest` step proves its patterns fire AND stay
          # silent, one twin per clause. Do not re-add a grep here without deleting the
          # scanner's pattern, or the next fixture change will fail one and pass the other.

          # A Nexus API key assigned to a literal. Each user supplies their OWN key via the
          # X4_NEXUS_KEY environment variable; a bundled key would also breach Nexus AUP.
          if grep -rnE 'X4_NEXUS_KEY[^A-Za-z_]{0,4}=[^A-Za-z_]{0,4}["'"'"'][A-Za-z0-9]{8,}' "${FILES[@]}"; then
            echo "::error::A Nexus API key literal is committed. Keys are per-user and must never be bundled."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "clean — no absolute user paths, profile ids or key literals in tracked files."

      # The three checks above are pattern-shaped: a user path needs a trailing
      # separator, a profile id needs the Egosoft prefix, a key needs an
      # assignment. A BARE contributor name matches none of them. This closes
      # that gap without writing any name into the workflow — the list is
      # derived from the repo's own commit metadata, minus whatever LICENSE and
      # the clone URL publish on purpose. See scripts/scan-identifiers.py.
      #
      # EXTRA_FORBIDDEN is optional: set the repo secret SCRUB_EXTRA to a
      # newline-separated list to ban strings git does not know about (an old
      # handle, a private folder name). Absent, the derived list stands alone.
      # Prove the scanner can still fail before trusting it to pass. Its own
      # population was wrong until 2026-08-29: it read `git ls-files`, which is
      # the INDEX, so a NEW file was structurally invisible to it. In CI that
      # list is always empty; the selftest is what keeps the merge honest.
      - name: Prove the identifier scanner can fail
        run: python3 scripts/scan-identifiers.py --selftest

      - name: Scan for contributor identifiers
        env:
          EXTRA_FORBIDDEN: ${{ secrets.SCRUB_EXTRA }}
        run: python3 scripts/scan-identifiers.py

      # ★ THE HISTORY CHANNEL, WHICH NOTHING RAN. `git push` publishes COMMITS, and
      # every other check here — this job's tree scan included — reads the WORKING
      # TREE. So all of them return clean on precisely the case that matters: an
      # identifier committed, noticed, and removed. It is gone from the tree and
      # still in the objects.
      #
      # MEASURED by the round-2 release reviewer: `--history` shipped in this release
      # and was invoked by NO CI step, so the instrument built for the pre-push check
      # did not run before a push. It needs the `fetch-depth: 0` this job already has;
      # the `tests` job's default depth-1 checkout is why its own history test SKIPS
      # there rather than failing, absorbed silently by X4_MAX_SKIPS.
      #
      # Scoped to the range since the last tag rather than to all history: everything
      # before it is already published, so a hit there is a disclosure that has
      # already happened and cannot be undone by holding this release. Falls back to
      # the root commit when no tag is reachable (a fork, a fresh clone).
      # The last tag BEFORE HEAD (`HEAD^`), not the last tag: when the release commit itself
      # is tagged (the v3.3.0 push), `git describe` returned that tag, the range was empty,
      # and the scan correctly refused to certify nothing -- a red job that checked nothing.
      - name: No personal data in the commits this push would publish
        run: |
          last_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          base="${last_tag:-$(git rev-list --max-parents=0 HEAD | tail -1)}"
          echo "scanning $base..HEAD"
          python3 scripts/scan-identifiers.py --history "$base..HEAD"
