- {id: write-host-transcript, source: protect-bash.sh, anchor: "on writes_host_transcript", fact: writes_host_transcript, verdict: deny, bucket: hook_only, reason: "path-scoped: a host session transcript, where typed save approvals are read"}
- {id: write-agent-settings, source: protect-bash.sh, anchor: "on writes_agent_settings", fact: writes_agent_settings, verdict: deny, bucket: hook_only, reason: "path- and content-scoped settings protection; no unconditional argv prefix"}
- id: lift-reference-deny
  source: protect-bash.sh
  anchor: "on lifts_reference_deny"
  fact: lifts_reference_deny
  verdict: ask
  bucket: prompt
  reason: "DECISIONS #16: lifting the reference/ OS protection is the user's step. The prefix covers `x4refguard.py remove`, which the hook asks on unconditionally; a raw `icacls /remove|/reset` asks only when aimed at the reference root (path-scoped), so that half stays hook-only"
  justification: "This lifts the OS delete/write protection on reference/ -- the user's step. Confirm only if they asked for it."
  pattern: [["python", "python3", "py"], "scripts/x4refguard.py", "remove"]
  match: [["python", "scripts/x4refguard.py", "remove"], ["python3", "scripts/x4refguard.py", "remove"]]
  not_match: [["python", "scripts/x4refguard.py", "status"], ["python", "scripts/x4refguard.py", "apply"]]

