# Codex `.rules` classification of EVERY verdict site in agent/guards/claude-hooks/protect-bash.sh
# (lane B Task 8). gen-agent-trees.py renders the forbidden/prompt rows to .codex/rules/x4.rules.
#
# The rule: a row becomes a Codex prefix_rule ONLY if every command matching its prefix gets AT
# LEAST that verdict from the hook -- a rule may never be stricter than the guard it mirrors.
# forbidden needs a hook DENY for every match example, prompt at least an ASK, under both shells
# (tests/test_codex_rules.py proves it against the live guard). Everything path-scoped,
# state-gated or parse-dependent is hook_only, with the reason.
#
# A row is keyed by `anchor` -- a distinctive substring of the site's line -- not by line number,
# so unrelated guard edits do not churn it. `optional: true` marks a site that may not exist in
# this tree yet (the 2026-10-02 profile split lands separately); every other row must match a
# site, and every site must match exactly one row (tests/test_codex_rules.py).
#
# Why so few prefix rules: Codex .rules see only argv prefixes (no paths, no state, no parse),
# and almost every guard rule depends on one of those. The rules are a second layer for the
# case where the hooks are not running (unreviewed or disabled hooks are silent -- spec 5.8);
# the hooks remain the guard.

- id: git-add-all
  source: protect-bash.sh
  anchor: "GIT ADD -A / . IN A SHARED WORKSPACE"
  fact: git_add_all
  verdict: deny
  bucket: forbidden
  reason: "stages every untracked file, including another session's work; prefix-exact"
  justification: "git add -A / --all / . stages EVERY untracked file, including another session's work-in-progress. Stage explicit paths (git add <file> ...)."
  pattern: ["git", "add", ["-A", "--all", "."]]
  match: [["git", "add", "-A"], ["git", "add", "--all"], ["git", "add", "."]]
  not_match: [["git", "add", "notes.md"], ["git", "status"], ["git", "add", "-p"]]

- {id: ps-unparseable, source: protect-bash.sh, anchor: "This PowerShell command does not parse", verdict: deny, bucket: hook_only, reason: "depends on parsing the whole command"}
- {id: bash-unparseable, source: protect-bash.sh, anchor: "This command does not PARSE", bucket: hook_only, reason: "depends on parsing the whole command (verdict changed ask->deny on 2026-10-02)"}
- {id: substituted-command-name, source: protect-bash.sh, anchor: "A command name here arrives through substitution", verdict: deny, bucket: hook_only, reason: "depends on parsing substitutions"}
- {id: part-not-analysed, source: protect-bash.sh, anchor: "Part of this command could not be analysed", verdict: ask, bucket: hook_only, reason: "depends on parsing nested PowerShell"}
- {id: over-nested, source: protect-bash.sh, anchor: "This command nests so many substitutions", bucket: hook_only, reason: "depends on expansion depth (verdict changed ask->deny on 2026-10-02)"}
- {id: cd-lanes-overflow, source: protect-bash.sh, anchor: "cd targets have so many possible values", verdict: deny, bucket: hook_only, reason: "depends on how many directories the cd targets can name (C7, v4.0 release review)"}
- {id: operand-expansion-incomplete, source: protect-bash.sh, anchor: "Brace or array operands could not be expanded completely", verdict: deny, bucket: hook_only, reason: "depends on bounded command expansion; no unconditional argv prefix can represent incomplete analysis"}
- {id: variable-command-name-protected-path, source: protect-bash.sh, anchor: "A command name here comes from a variable or expansion", verdict: ask, bucket: hook_only, reason: "path-scoped, and depends on reading which word is the command name (F10, v4.0)"}
- {id: rm-game, source: protect-bash.sh, anchor: "on rm_hits_game", fact: rm_hits_game, verdict: deny, bucket: hook_only, reason: "path-scoped: the configured game root"}
- {id: rm-reference, source: protect-bash.sh, anchor: "on rm_targets_reference", fact: rm_targets_reference, verdict: deny, bucket: hook_only, reason: "path-scoped: the configured reference root"}
