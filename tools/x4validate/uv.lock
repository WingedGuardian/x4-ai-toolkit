[[package]]
name = "x4validate"
version = "4.0.0"
source = { editable = "." }
dependencies = [
    { name = "lxml" },
    { name = "ruamel-yaml" },
]

[package.optional-dependencies]
geometry = [
    { name = "numpy" },
    { name = "rtree" },
    { name = "scipy" },
    { name = "trimesh" },
]

[package.dev-dependencies]
dev = [
    { name = "lupa" },
    { name = "pytest" },
    { name = "pywin32", marker = "sys_platform == 'win32'" },
]

[package.metadata]
requires-dist = [
    { name = "lxml", specifier = ">=5.0" },
    { name = "numpy", marker = "extra == 'geometry'", specifier = ">=2.2,<3" },
    { name = "rtree", marker = "extra == 'geometry'", specifier = ">=1.4,<2" },
    { name = "ruamel-yaml", specifier = ">=0.18" },
    { name = "scipy", marker = "extra == 'geometry'", specifier = ">=1.15,<2" },
    { name = "trimesh", marker = "extra == 'geometry'", specifier = ">=4.6,<5" },
]
provides-extras = ["geometry"]

[package.metadata.requires-dev]
dev = [
    { name = "lupa", specifier = ">=2.0" },
    { name = "pytest", specifier = ">=8.0" },
    { name = "pywin32", marker = "sys_platform == 'win32'", specifier = ">=306" },
]
