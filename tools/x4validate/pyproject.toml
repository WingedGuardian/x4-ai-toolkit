[project]
name = "x4validate"
version = "4.0.0"
description = "X4 Foundations cross-file XML diff/reference/completeness validator"
requires-python = ">=3.13"
dependencies = ["lxml>=5.0", "ruamel.yaml>=0.18"]

[project.scripts]
x4validate = "x4validate._cli:main"
x4modlist = "x4validate._modlist:main"
x4compat = "x4validate._compat:main"
x4xref = "x4validate._xref:main"
x4stats = "x4validate._stats:main"
x4similar = "x4validate._similarity:main"
x4effective = "x4validate._effectivecli:main"
x4diff = "x4validate._diffcli:main"
x4debug = "x4validate._debugcli:main"
x4save = "x4validate._savecli:main"
x4live = "x4validate._livecli:main"

[project.optional-dependencies]
geometry = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "trimesh>=4.6,<5",
    "rtree>=1.4,<2",
]

[dependency-groups]
# pywin32 is DEV-ONLY and Windows-ONLY. The live-query channel (x4live query/ramp)
# needs it; every other subcommand does not, and the marker keeps the ubuntu CI job
# installable. `_livepipe._win32()` refuses with rc 2 naming the reason when absent,
# so a machine without it loses one feature rather than the package.
dev = ["pytest>=8.0", "pywin32>=306; sys_platform == 'win32'", "lupa>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x4validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: ALWAYS name every skip and its reason. Without it the summary says "14 skipped"
# and nothing else, which is how 125 tests sat silently skipped behind a lookup that
# could not succeed in the public tree. A skip is a test that did not run.
addopts = "-rs"
