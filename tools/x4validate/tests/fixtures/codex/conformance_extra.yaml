  claude: [{path: "{TK}/reference/libraries/x.xml"}]
  expect: deny

# 4.0.1 (user ruling 2026-10-28): the profile ROOT content.xml -- the mod enable/disable
# list -- is advisory; every other profile file still asks (twin below).
- id: profile-modlist-advises
  fixture: apply_patch_update
  command: "*** Begin Patch\n*** Update File: {TMP}/profile/content.xml\n@@\n-a\n+b\n*** End Patch"
  claude: [{path: "{TMP}/profile/content.xml"}]
  expect: advise
- id: profile-config-asks
  fixture: apply_patch_update
  command: "*** Begin Patch\n*** Update File: {TMP}/profile/config.xml\n@@\n-a\n+b\n*** End Patch"
  claude: [{path: "{TMP}/profile/config.xml"}]
  expect: ask

# Lane F: a RELATIVE shell operand is judged from the payload cwd, on both chains. The Claude
# side carries the same `cwd` in its payload (Claude Code always sends it).
- id: shell-relative-delete-in-reference
  fixture: bash_powershell
  shell: bash
  command: "rm -f reference/libraries/wares.xml"
  claude: [{command: "rm -f reference/libraries/wares.xml"}]
  expect: deny

- id: powershell-relative-delete-in-reference
  fixture: bash_powershell
  shell: powershell
  command: "Remove-Item reference\\libraries\\wares.xml"
  claude: [{tool: PowerShell, command: "Remove-Item reference\\libraries\\wares.xml"}]
  expect: deny

- id: shell-relative-delete-twin-from-an-unrelated-cwd
  fixture: bash_powershell
  shell: bash
  cwd: "{TMP}"
  command: "rm -f reference/libraries/wares.xml"
  claude: [{command: "rm -f reference/libraries/wares.xml"}]
  expect: allow
